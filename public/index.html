<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sky Squad — 온라인 협동 슈팅</title>
<style>
  :root { --bg:#070b1a; --panel:#101733; --line:#2a3566; --text:#e8ecff; --dim:#8f9ac7; --accent:#4de1ff; --warn:#ff6b7a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; background:#050816; touch-action:none; box-shadow:0 0 60px rgba(77,225,255,.12); }
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:16px;
    background:rgba(5,8,22,.78); backdrop-filter: blur(3px); }
  .overlay[hidden] { display:none; }
  .card { width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px; text-align:center; }
  h1 { margin:0 0 4px; font-size:34px; letter-spacing:.06em; font-weight:800; }
  h1 span { color:var(--accent); }
  h2 { margin:0 0 12px; font-size:20px; }
  p.sub { margin:0 0 20px; color:var(--dim); font-size:14px; }
  label { display:block; text-align:left; font-size:12px; color:var(--dim); margin:12px 0 4px; }
  input { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:#0a1026; color:var(--text); font-size:16px; outline:none; }
  input:focus { border-color:var(--accent); }
  #code { text-transform:uppercase; letter-spacing:.3em; text-align:center; font-weight:700; }
  button { width:100%; margin-top:12px; padding:13px; border:0; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer;
    background:var(--accent); color:#04121a; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:8px; }
  .row input { flex:1; } .row button { width:auto; margin-top:0; padding:0 18px; }
  .or { margin:16px 0 0; color:var(--dim); font-size:12px; }
  .err { color:var(--warn); font-size:13px; min-height:18px; margin-top:10px; }
  .bigcode { font-size:44px; font-weight:800; letter-spacing:.25em; color:var(--accent); margin:4px 0 2px; padding-left:.25em; }
  ul { list-style:none; margin:16px 0 4px; padding:0; text-align:left; }
  li { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; background:#0a1026; margin-bottom:6px; font-size:15px; }
  li i { width:12px; height:12px; border-radius:50%; flex:none; }
  li b { margin-left:auto; font-weight:600; color:var(--dim); font-size:13px; }
  .help { margin-top:16px; color:var(--dim); font-size:12px; line-height:1.6; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div class="overlay" id="menu">
  <div class="card">
    <h1>SKY <span>SQUAD</span></h1>
    <p class="sub">친구와 함께하는 2~4인 온라인 협동 슈팅</p>
    <label for="name">닉네임</label>
    <input id="name" maxlength="12" placeholder="파일럿" autocomplete="off">
    <button id="create">새 방 만들기</button>
    <div class="or">또는 친구의 방 코드로 참가</div>
    <div class="row" style="margin-top:8px">
      <input id="code" maxlength="4" placeholder="ABCD" autocomplete="off">
      <button id="join" class="ghost">참가</button>
    </div>
    <div class="err" id="err"></div>
    <div class="help">이동: 방향키 / WASD · 모바일은 화면 드래그<br>사격은 자동입니다</div>
  </div>
</div>

<div class="overlay" id="lobby" hidden>
  <div class="card">
    <p class="sub" style="margin:0">방 코드</p>
    <div class="bigcode" id="roomcode"></div>
    <button id="copy" class="ghost" style="margin-top:6px">초대 링크 복사</button>
    <ul id="plist"></ul>
    <button id="start">게임 시작</button>
    <div class="help" id="waitmsg"></div>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="card">
    <h2>GAME OVER</h2>
    <p class="sub" id="result"></p>
    <ul id="scores"></ul>
    <button id="restart">다시 시작</button>
    <div class="help" id="waitmsg2"></div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
